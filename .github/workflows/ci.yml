name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Build Kaappi and kaappi-net
        run: |
          git clone --depth 1 https://github.com/kaappi/kaappi.git /tmp/kaappi
          cd /tmp/kaappi && zig build
          git clone --depth 1 https://github.com/kaappi/kaappi-net.git /tmp/kaappi-net
          cd /tmp/kaappi-net && make

      - name: Run tests
        run: |
          for f in tests/*.scm; do
            echo "=== $f ==="
            /tmp/kaappi/zig-out/bin/kaappi --coverage-xml coverage.xml --lib-path lib --lib-path /tmp/kaappi-net/lib "$f"
          done
        env:
          LD_LIBRARY_PATH: /tmp/kaappi-net
          DYLD_LIBRARY_PATH: /tmp/kaappi-net

      # Real socket round-trip against a local sink — the arity bug this
      # guards against was invisible to any test that never moved bytes.
      - name: Run SMTP round-trip test
        timeout-minutes: 3
        run: bash tests/test-smtp-roundtrip.sh
        env:
          KAAPPI: /tmp/kaappi/zig-out/bin/kaappi
          NET_LIB: /tmp/kaappi-net/lib
          LD_LIBRARY_PATH: /tmp/kaappi-net
          DYLD_LIBRARY_PATH: /tmp/kaappi-net

      - name: Upload to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: coverage.xml
          fail_ci_if_error: false
